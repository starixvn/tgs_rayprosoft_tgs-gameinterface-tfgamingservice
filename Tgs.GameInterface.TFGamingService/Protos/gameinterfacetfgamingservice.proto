syntax = "proto3";

import "phoenix/protobuf/decimal.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Tgs.GameInterface.TFGamingService.Protos";

package GameInterfaceTFGamingService;

// The greeting service definition.
service  GameInterfaceTFGamingService{
  // Sends a greeting
  rpc PlayerCreate (PlayerCreateRequest) returns (BaseReply);
  rpc PlayerBalance (PlayerBalanceRequest) returns (PlayerBalanceReply);  
  rpc FundIn (FundRequest) returns (FundReply);
  rpc FundOut (FundRequest) returns (FundReply);
  rpc FundStatus(FundStatusRequest) returns (FundStatusReply);
  rpc FundHistory (FundHistoryRequest) returns (FundHistoryReply);
  rpc GameHistorySettled (GameHistorySettledRequest) returns (GameHistorySettledReply);
  rpc GameHistoryUnsettled (GameHistoryUnsettledRequest) returns (GameHistoryUnsettledReply);
  rpc PlayerKick (PlayerKickRequest) returns (BaseReply);
  rpc GameUrl (GameUrlRequest) returns (GameUrlReply);
}

// The request message containing the user's name.
message FundRequest {
	string api_url = 1;
	string operator_id = 2;
	string private_token = 3;
	string member = 4;
	string ref_transaction_code = 5;
	phoenix.protobuf.DecimalValue amount = 6;
}

message FundStatusRequest {
	string api_url = 1;	
	string private_token = 2;
	string ref_transaction_code = 3;
}

message FundHistoryRequest{
	string api_url = 1;	
	string private_token = 2;
	string ref_transaction_code = 3;
	int32 page = 4;
	int32 page_size = 5;
}

message PlayerBalanceRequest {
	string api_url = 1;
	string private_token = 2;
	string member_code = 3;
}

message PlayerCreateRequest {
	string api_url = 1;
	string private_token = 2;
	string member_code = 3;
}

message GameHistorySettledRequest {
	string api_url = 1;
	string private_token = 2;
	google.protobuf.Timestamp start_time = 3; 
	google.protobuf.Timestamp end_time = 4;
	int32 page = 5;
	int32 page_size = 6;
}

message GameHistoryUnsettledRequest {
	string api_url = 1;
	string private_token = 2;
	google.protobuf.Timestamp start_time = 3; 
	google.protobuf.Timestamp end_time = 4;
	int32 page = 5;
	int32 page_size = 6;
}

message PlayerKickRequest {
	string api_url = 1;
	string private_token = 2;
	string operator_id = 3;
	string member = 4;
}

message GameUrlRequest{
	string api_url = 1;
	string private_token = 2;
	string member_code = 3;
}

// The response message containing the greetings.
message BaseReply{
	bool status = 1;
}

message GameUrlReply{
	string game_url = 1;
}

message PlayerBalanceReply {
	bool is_player_exist = 1;
	phoenix.protobuf.DecimalValue balance = 2;
}

message FundReply {
	string ref_transaction_code = 1;
    string transaction_id = 2;
    phoenix.protobuf.DecimalValue balance = 3; 
}

message FundStatusReply {
	bool is_order_exist = 1;
}

message FundHistoryReply{
	repeated FundHistory items = 1;
}

message FundHistory{
	string ref_transaction_code = 1;
	string transaction_id = 2;
	phoenix.protobuf.DecimalValue amount = 3;
	string operator_name = 4;
	string member_code = 5;
	string transaction_type = 6;
	google.protobuf.Timestamp transaction_date = 7;
	string status = 8;
	phoenix.protobuf.DecimalValue balance = 9;
}


message GameHistorySettledReply {
	repeated GameHistorySettled items = 1;
}

message GameHistorySettled {
    string player_code = 1;
    string external_round_id = 2;    
	GameHistoryStatus status = 3;
	google.protobuf.Timestamp external_created_on = 4;
	google.protobuf.Timestamp external_closed_on = 5;
	phoenix.protobuf.DecimalValue bet = 6;
	phoenix.protobuf.DecimalValue valid_bet = 7;
	phoenix.protobuf.DecimalValue player_win_loss = 8;
	phoenix.protobuf.DecimalValue turnover = 9;
	phoenix.protobuf.DecimalValue settle = 10;
    string additional_data = 11;
}

message GameHistoryUnsettledReply {
	repeated GameHistoryUnsettled items = 1;
}

message GameHistoryUnsettled {
    string player_code = 1;
    string external_round_id = 2;
	google.protobuf.Timestamp external_created_on = 3;
	phoenix.protobuf.DecimalValue bet = 4;
	phoenix.protobuf.DecimalValue valid_bet = 5;
    string additional_data = 6;
}

enum GameHistoryStatus{		
	GAME_HISTORY_STATUS_WIN = 0;
	GAME_HISTORY_STATUS_LOSS = 1;	
	GAME_HISTORY_STATUS_DRAW = 2;
	GAME_HISTORY_STATUS_CANCELED = 3;	
}