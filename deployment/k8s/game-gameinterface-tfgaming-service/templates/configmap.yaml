apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gameinterface-tfgaming-service.fullname" . }}
  labels:
    {{- include "game-gameinterface-tfgaming-service.labels" . | nindent 4 }}
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Warning",
          "Microsoft.AspNetCore": "Warning",
          "Tgs.GameInterface.TFGamingService.Core": "Information"
        }
      },
      "Kestrel": {
        "EndpointDefaults": {
          "Protocols": "Http2"
        },
        "Endpoints": {
          "HealthCheck": {
            "Url": "http://*:{{ .Values.service.port }}",
            "Protocols": "Http1"
          },
          "Grpc": {
            "Url": "http://*:{{ .Values.servicegrpc.port }}"
          }
        }
      }
    }
  monitor.settings.json: |
    {
      "Metrics": {
        "MetricCount": "1"
      },
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
